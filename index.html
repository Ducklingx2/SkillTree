```html
<div class="detail-comments">

    <!-- Replies header -->
    <div class="detail-comments-header">

        <div class="comments-heading">
            <span class="comments-eyebrow">
                COMMUNITY
            </span>

            <h3>
                Replies
            </h3>

            <p class="comments-subtitle">
                Share ideas, ask questions, and help each other learn.
            </p>
        </div>

        <span
            id="detailCommentCount"
            class="comment-count"
            aria-label="Number of replies"
        >
            0
        </span>

    </div>


    <!-- Replies list -->
    <div
        id="detailComments"
        class="comments-list"
        aria-live="polite"
        aria-label="Replies to this post"
    ></div>


    <!-- Reply composer -->
    <div class="comment-composer">

        <!-- Current user's avatar -->
        <div
            class="composer-avatar"
            aria-hidden="true"
        >
            ?
        </div>


        <form
            id="detailCommentForm"
            class="comment-form"
            aria-label="Write a reply"
        >

            <div class="comment-input-wrap">

                <label
                    for="detailCommentInput"
                    class="sr-only"
                >
                    Write a reply
                </label>

                <textarea
                    id="detailCommentInput"
                    name="comment"
                    rows="3"
                    maxlength="2000"
                    placeholder="Share something useful..."
                    aria-describedby="commentHint"
                    required
                ></textarea>


                <div class="comment-input-footer">

                    <span
                        id="commentHint"
                        class="comment-hint"
                    >
                        Be useful. Be human.
                    </span>

                    <button
                        id="detailCommentSubmit"
                        type="submit"
                        class="comment-submit"
                    >
                        <span>
                            Reply
                        </span>

                        <span
                            class="comment-submit-icon"
                            aria-hidden="true"
                        >
                            ↗
                        </span>
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>
```
